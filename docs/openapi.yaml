openapi: 3.1.0
info:
  title: Tracking Research Status API
  version: 2.0.0
  description: |
    API contract for the Tracking Research Status MVP.

    Authentication uses Bearer JWT access tokens issued by the university SSO.
    The backend validates the token and maps the subject to a SQLite account
    with role RESEARCHER, COORDINATOR, or ADMIN and account status PENDING,
    APPROVED, or SUSPENDED. Protected operations enforce both status and role.
    All approved roles may read research data; only COORDINATOR and ADMIN may
    create, update, delete, or advance research. User administration, academic
    title mutation, public-information mutation, and audit logs are ADMIN-only.
    Research IDs remain internal database/API references, including path IDs
    and continuationOfId. The UI does not display or search by ID; it uses
    contractNumber instead, while retaining title search as defined in SPEC.md.

    Every error response uses `{"error":{"code":"...","message":"..."}}` and
    does not expose stack traces or database details. Unknown routes return
    `404 ROUTE_NOT_FOUND`; unsupported methods on known routes return
    `405 METHOD_NOT_ALLOWED`.

    POST and PUT accept multipart/form-data with one PDF contract file; PATCH
    accepts one JSON object. Media types are matched case-insensitively. JSON
    duplicate keys, unknown fields, and non-object top-level values are
    rejected. The PDF limit is 20 MiB and the PATCH JSON limit is 64 KiB.
    Responses remain JSON and contain project data and PDF metadata, not file bytes.
    The UI prevents repeated submission and does not retry mutations automatically.
    General concurrent updates use last-successful-write-wins without entity versions.
security:
  - bearerAuth: []
servers:
  - url: /

tags:
  - name: Health
    description: Service and database availability.
  - name: Researches
    description: Research records, status, and process.
  - name: Authentication
    description: University SSO identity and session operations.
  - name: Users
    description: Administrator-only account approval and management.
  - name: AcademicTitles
    description: Academic title lookup and administrator maintenance.
  - name: PublicInformation
    description: Published office information and administrator maintenance.
  - name: AuditLogs
    description: Administrator-only immutable change history.

paths:
  /health:
    get:
      security: []
      tags:
        - Health
      operationId: getHealth
      summary: Check service availability
      description: Checks whether the service and its database are available.
      responses:
        "200":
          description: The service and database are available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Get the authenticated account
      responses:
        "200":
          description: Authenticated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: End the current authenticated session
      responses:
        "204":
          description: Session ended.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/researches:
    get:
      tags:
        - Researches
      operationId: listResearches
      summary: List all researches
      description: |
        Returns researches visible to the authenticated user. q searches title
        and contract number; status and process are combined with q using AND.
        An empty result returns `[]`.
      parameters:
        - name: q
          in: query
          schema: {type: string}
        - name: status
          in: query
          schema: {$ref: "#/components/schemas/ResearchStatus"}
        - name: process
          in: query
          schema: {$ref: "#/components/schemas/ResearchProcess"}
      responses:
        "200":
          description: The complete research list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResearchSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountUnavailable"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags:
        - Researches
      operationId: createResearch
      summary: Create a research
      description: |
        Creates one research atomically from multipart form data. The server generates a positive,
        immutable, unique ID that is never reused after deletion. Status starts
        at "กำลังดำเนินการ" and process starts at "สัญญาโครงการ".

        continuationOfId is required. A root research sends null; a continuation
        sends the positive ID of an existing research. The referenced research
        may already be completed or terminated. A root title cannot duplicate
        any existing trimmed title. Continuations may use duplicate titles.
        Title comparison is case-sensitive after Unicode trimming. Every required
        form part occurs exactly once; unknown or duplicate parts, including a
        projectMembers part that is not one JSON array, are validation errors.
        Multipart scalar parts use UTF-8 text: booleans are true/false, numeric
        values are decimal, and a null continuationOfId is the literal text null.
        BUDGET requires null continuationOfId; CONTINUATION requires a positive ID.
        contractNumber is unique after Unicode trimming and case-insensitive
        Unicode case folding. Each repeated POST is a new create attempt and is
        checked against the title and contract-number uniqueness rules; clients
        do not retry this mutation automatically.
        Selecting a file in the browser alone does not upload or persist it.
        Failed persistence must clean temporary files and must not expose partial data.
      requestBody:
        required: true
        x-max-body-bytes: 22020096
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateResearchRequest"
            encoding:
              projectMembers:
                contentType: application/json
              contractFile:
                contentType: application/pdf
      responses:
        "201":
          description: The research was created and persisted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Research"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenOrAccountUnavailable"
        "404":
          $ref: "#/components/responses/ContinuationNotFound"
        "409":
          $ref: "#/components/responses/ResearchConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/researches/{id}:
    parameters:
      - $ref: "#/components/parameters/ResearchId"

    get:
      tags: [Researches]
      operationId: getResearch
      summary: Get research details
      responses:
        "200":
          description: Complete research details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Research"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResearchNotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      tags:
        - Researches
      operationId: updateResearch
      summary: Replace research details
      description: |
        Atomically replaces all editable data and optionally the contract PDF. ID,
        continuationOfId, researchKind, status, and process remain unchanged. A root may retain its current title
        while changing other data even when a continuation has the same title.
        If a root changes its title, the new trimmed title cannot duplicate any
        existing research title. A continuation may change to a duplicate title.
        Every required form part occurs exactly once; unknown or duplicate parts,
        including a projectMembers part that is not one JSON array, are validation
        errors. Scalar encoding follows the create operation. contractFile is
        optional: omit it to retain the existing file and metadata; include it
        to replace the old PDF only after the complete update succeeds. Failure
        must preserve the previous project and PDF and clean temporary files.
        Concurrent replacements use last-successful-write-wins; this operation
        does not use a version field or If-Match precondition.
      requestBody:
        required: true
        x-max-body-bytes: 22020096
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UpdateResearchRequest"
            encoding:
              projectMembers:
                contentType: application/json
              contractFile:
                contentType: application/pdf
      responses:
        "200":
          description: The research details were replaced successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Research"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResearchNotFound"
        "409":
          $ref: "#/components/responses/ResearchConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags:
        - Researches
      operationId: deleteResearch
      summary: Delete a research
      description: |
        Deletes the research identified by ID. The deleted ID is never reused.
        A research referenced through continuationOfId cannot be deleted. This
        operation accepts neither a non-empty request body nor query parameters.
        Success deletes the research, members, contract metadata, and PDF. If
        either persistent data or file deletion fails, the operation fails and
        the original data and PDF remain usable; partial success is forbidden.
      responses:
        "204":
          description: The research was deleted successfully; the response has no body.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResearchNotFound"
        "409":
          $ref: "#/components/responses/ResearchHasContinuations"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/researches/{id}/contract-file:
    parameters:
      - $ref: "#/components/parameters/ResearchId"
    get:
      tags: [Researches]
      operationId: getResearchContractFile
      summary: Download the research contract PDF
      responses:
        "200":
          description: Contract PDF.
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            application/pdf:
              schema: {type: string, format: binary}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResearchOrContractFileNotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/researches/{id}/status:
    parameters:
      - $ref: "#/components/parameters/ResearchId"

    patch:
      tags:
        - Researches
      operationId: updateResearchStatus
      summary: Advance research status
      description: |
        Updates status atomically from the latest persisted value. A normal
        status may move only to the next normal status, or jump directly to
        "โครงการเสร็จสิ้น" or "ยุติโครงการ". Normal statuses cannot be skipped
        or reversed. Sending the current status again is idempotent and returns
        200, including the same terminal status.

        Both terminal statuses end the project. Entering a terminal status keeps
        the current process unchanged and does not mark it complete. After that,
        status cannot change to another value and process cannot advance.
      requestBody:
        required: true
        x-max-body-bytes: 65536
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStatusRequest"
      responses:
        "200":
          description: Status was advanced or the idempotent value was accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Research"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/InvalidJson"
        "404":
          $ref: "#/components/responses/ResearchNotFound"
        "409":
          $ref: "#/components/responses/StatusConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/researches/{id}/process:
    parameters:
      - $ref: "#/components/parameters/ResearchId"

    patch:
      tags:
        - Researches
      operationId: updateResearchProcess
      summary: Advance research process
      description: |
        Updates the single current process atomically from the latest persisted
        value. Process may move only to the next value; it cannot skip, reverse,
        or advance beyond "การปิดบัญชีธนาคาร". Sending the current process again
        is idempotent and returns 200 only while the project has not ended.

        Advancing process does not change status. Completing the final process
        does not automatically complete the project. Process cannot be changed
        after status becomes "โครงการเสร็จสิ้น" or "ยุติโครงการ", including
        requests for the current process; terminal lock takes precedence.
      requestBody:
        required: true
        x-max-body-bytes: 65536
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProcessRequest"
      responses:
        "200":
          description: Process was advanced or the idempotent value was accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Research"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/InvalidJson"
        "404":
          $ref: "#/components/responses/ResearchNotFound"
        "409":
          $ref: "#/components/responses/ProcessConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List accounts (ADMIN only)
      parameters:
        - name: status
          in: query
          schema: {$ref: "#/components/schemas/AccountStatus"}
      responses:
        "200":
          description: Account list.
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/User"}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Users]
      operationId: getUser
      summary: Get an account (ADMIN only)
      responses:
        "200":
          description: Account details.
          content: {application/json: {schema: {$ref: "#/components/schemas/User"}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/UserNotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "500": {$ref: "#/components/responses/InternalError"}
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Update an account (ADMIN only)
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/UpdateUserRequest"}}}
      responses:
        "200":
          description: Updated account.
          content: {application/json: {schema: {$ref: "#/components/schemas/User"}}}
        "400": {$ref: "#/components/responses/InvalidJson"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/UserNotFound"}
        "409": {$ref: "#/components/responses/EmailConflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/users/{id}/status:
    parameters:
      - $ref: "#/components/parameters/UserId"
    patch:
      tags: [Users]
      operationId: updateUserStatus
      summary: Update account status (ADMIN only)
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/UpdateAccountStatusRequest"}}}
      responses:
        "200":
          description: Updated account.
          content: {application/json: {schema: {$ref: "#/components/schemas/User"}}}
        "400": {$ref: "#/components/responses/InvalidJson"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/UserNotFound"}
        "409": {$ref: "#/components/responses/AccountTransitionConflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/academic-titles:
    get:
      tags: [AcademicTitles]
      operationId: listAcademicTitles
      summary: List academic titles
      responses:
        "200":
          description: Academic title list.
          content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/AcademicTitle"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/InternalError"}
    post:
      tags: [AcademicTitles]
      operationId: createAcademicTitle
      summary: Create an academic title (ADMIN only)
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/AcademicTitleRequest"}}}
      responses:
        "201":
          description: Created title.
          content: {application/json: {schema: {$ref: "#/components/schemas/AcademicTitle"}}}
        "400": {$ref: "#/components/responses/InvalidJson"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/AcademicTitleConflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/academic-titles/{id}:
    parameters:
      - $ref: "#/components/parameters/AcademicTitleId"
    patch:
      tags: [AcademicTitles]
      operationId: updateAcademicTitle
      summary: Update an academic title (ADMIN only)
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/AcademicTitleRequest"}}}
      responses:
        "200":
          description: Updated title.
          content: {application/json: {schema: {$ref: "#/components/schemas/AcademicTitle"}}}
        "400": {$ref: "#/components/responses/InvalidJson"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/AcademicTitleNotFound"}
        "409": {$ref: "#/components/responses/AcademicTitleConflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "500": {$ref: "#/components/responses/InternalError"}
    delete:
      tags: [AcademicTitles]
      operationId: deleteAcademicTitle
      summary: Delete an academic title (ADMIN only)
      responses:
        "204": {description: Academic title deleted.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/AcademicTitleNotFound"}
        "409": {$ref: "#/components/responses/AcademicTitleInUse"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/about:
    get:
      security: []
      tags: [PublicInformation]
      operationId: getAbout
      summary: Get published about information
      responses:
        "200": {description: About information., content: {application/json: {schema: {$ref: "#/components/schemas/About"}}}}
        "500": {$ref: "#/components/responses/InternalError"}
    put:
      tags: [PublicInformation]
      operationId: updateAbout
      summary: Update about information (ADMIN only)
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/UpdateAboutRequest"}}}}
      responses:
        "200": {description: Updated about information., content: {application/json: {schema: {$ref: "#/components/schemas/About"}}}}
        "400": {$ref: "#/components/responses/InvalidJson"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/organization:
    get:
      security: []
      tags: [PublicInformation]
      operationId: getOrganization
      summary: Get published organization information
      responses:
        "200": {description: Organization information., content: {application/json: {schema: {$ref: "#/components/schemas/Organization"}}}}
        "500": {$ref: "#/components/responses/InternalError"}
    put:
      tags: [PublicInformation]
      operationId: updateOrganization
      summary: Update organization information (ADMIN only)
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/UpdateOrganizationRequest"}}}}
      responses:
        "200": {description: Updated organization information., content: {application/json: {schema: {$ref: "#/components/schemas/Organization"}}}}
        "400": {$ref: "#/components/responses/InvalidJson"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/audit-logs:
    get:
      tags: [AuditLogs]
      operationId: listAuditLogs
      summary: List immutable audit events (ADMIN only)
      parameters:
        - {name: userId, in: query, schema: {type: integer, format: int64, minimum: 1}}
        - {name: researchId, in: query, schema: {type: integer, format: int64, minimum: 1}}
        - {name: action, in: query, schema: {type: string, minLength: 1}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
      responses:
        "200": {description: Audit events., content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/AuditLog"}}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "500": {$ref: "#/components/responses/InternalError"}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token issued by the university SSO.

  parameters:
    ResearchId:
      name: id
      in: path
      required: true
      description: Positive, immutable server-generated research ID.
      schema:
        $ref: "#/components/schemas/ResearchId"
    UserId:
      name: id
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    AcademicTitleId:
      name: id
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}

  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: ok

    Research:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - continuationOfId
        - isSubsidized
        - projectMembers
        - fundingType
        - fundingSourceName
        - contractNumber
        - projectType
        - researchKind
        - responsibleProjectUnit
        - responsibleBudgetUnit
        - startDate
        - endDate
        - budgetAmount
        - thaiAbstract
        - englishAbstract
        - objectives
        - keywords
        - status
        - process
      properties:
        id:
          $ref: "#/components/schemas/ResearchId"
        title:
          $ref: "#/components/schemas/ResearchTitle"
        continuationOfId:
          $ref: "#/components/schemas/NullableResearchId"
        isSubsidized:
          type: boolean
        projectMembers:
          type: array
          items:
            $ref: "#/components/schemas/ResearchMember"
        fundingType:
          $ref: "#/components/schemas/FundingType"
        fundingSourceName:
          $ref: "#/components/schemas/ResearchText"
        contractNumber:
          $ref: "#/components/schemas/ContractNumber"
        contractFile:
          $ref: "#/components/schemas/ContractFileMetadata"
        projectType:
          $ref: "#/components/schemas/ProjectType"
        researchKind:
          $ref: "#/components/schemas/ResearchKind"
        responsibleProjectUnit:
          $ref: "#/components/schemas/ResearchText"
        responsibleBudgetUnit:
          $ref: "#/components/schemas/ResearchText"
        startDate:
          $ref: "#/components/schemas/BuddhistDate"
        endDate:
