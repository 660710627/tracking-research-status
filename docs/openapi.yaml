        projectType:
          $ref: "#/components/schemas/ProjectType"
        researchKind:
          $ref: "#/components/schemas/ResearchKind"
        responsibleProjectUnit:
          $ref: "#/components/schemas/ResearchText"
        responsibleBudgetUnit:
          $ref: "#/components/schemas/ResearchText"
        startDate:
          $ref: "#/components/schemas/BuddhistDate"
        endDate:
          $ref: "#/components/schemas/BuddhistDate"
          description: |
            Must be at least one calendar year after startDate. Use the same
            day and month in the following Buddhist year; when a 29 February
            anniversary does not exist, 1 March is the minimum valid end date.
        budgetAmount:
          $ref: "#/components/schemas/BudgetAmount"
        thaiAbstract:
          $ref: "#/components/schemas/ResearchText"
        englishAbstract:
          $ref: "#/components/schemas/ResearchText"
        objectives:
          $ref: "#/components/schemas/ResearchText"
        keywords:
