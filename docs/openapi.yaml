        - fundingType
        - fundingSourceName
        - contractNumber
        - projectType
        - responsibleProjectUnit
        - responsibleBudgetUnit
        - startDate
        - endDate
        - budgetAmount
        - thaiAbstract
        - englishAbstract
        - objectives
        - keywords
      properties:
        title:
          $ref: "#/components/schemas/ResearchTitle"
        isSubsidized:
          type: boolean
        projectMembers:
          type: array
          minItems: 2
          maxItems: 2
          description: |
            Exactly one form part containing a JSON array. The array must contain
            exactly one LEAD and exactly one CO_RESEARCHER, representing two
            distinct people. Reject duplicate emails within the project and
            require contributionPercent values to sum to exactly 100.
            For duplicate detection within a project, trim leading and trailing
            whitespace from emails and compare case-insensitively.
          items:
            $ref: "#/components/schemas/ResearchMember"
        fundingType:
          $ref: "#/components/schemas/FundingType"
        fundingSourceName:
          $ref: "#/components/schemas/ResearchText"
        contractNumber:
          $ref: "#/components/schemas/ContractNumber"
        contractFile:
          $ref: "#/components/schemas/ContractFile"
        projectType:
          $ref: "#/components/schemas/ProjectType"
        responsibleProjectUnit:
          $ref: "#/components/schemas/ResearchText"
        responsibleBudgetUnit:
          $ref: "#/components/schemas/ResearchText"
        startDate:
          $ref: "#/components/schemas/BuddhistDate"
        endDate:
          $ref: "#/components/schemas/BuddhistDate"
          description: |
            Must be at least one calendar year after startDate. Use the same
            day and month in the following Buddhist year; when a 29 February
            anniversary does not exist, 1 March is the minimum valid end date.
        budgetAmount:
          $ref: "#/components/schemas/BudgetAmount"
        thaiAbstract:
          $ref: "#/components/schemas/ResearchText"
        englishAbstract:
          $ref: "#/components/schemas/ResearchText"
        objectives:
          $ref: "#/components/schemas/ResearchText"
        keywords:
          $ref: "#/components/schemas/ResearchText"

    UpdateStatusRequest:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          $ref: "#/components/schemas/ResearchStatus"

    UpdateProcessRequest:
      type: object
      additionalProperties: false
      required:
        - process
      properties:
        process:
          $ref: "#/components/schemas/ResearchProcess"

    ResearchId:
      type: integer
      format: int64
      minimum: 1

    NullableResearchId:
      type:
        - integer
        - "null"
      format: int64
      minimum: 1
      description: |
        null identifies a root research. A positive integer identifies an
        existing parent research, including a completed or terminated parent.

    ResearchTitle:
      type: string
      minLength: 1
      maxLength: 1000
      pattern: '^[^/\x00-\x1F\x7F]+$'
      description: |
        Length is measured in Unicode code points after trimming Unicode
        whitespace and must be 1–1,000. Newline,
        tab, NUL, other control characters, and `/` are forbidden. Duplicate
        comparison is case-sensitive after trimming; continuation rules decide
        whether a duplicate is permitted.

    ResearchText:
      type: string
      minLength: 1
      maxLength: 1000
      pattern: '^[^\x00-\x08\x0B\x0C\x0E-\x1F\x7F]+$'
      description: |
        Length is measured in Unicode code points after trimming Unicode
        whitespace and must be 1–1,000. NUL and control characters other than
        newline and tab are forbidden.

    ContractNumber:
      type: string
      minLength: 1
      maxLength: 1000
      pattern: '^[^\x00-\x08\x0B\x0C\x0E-\x1F\x7F]+$'
      description: |
        Length is measured in Unicode code points after trimming Unicode
        whitespace and must be 1–1,000. The value must be globally unique after
        trimming and case-insensitive Unicode case folding. NUL and control
        characters other than newline and tab are forbidden.

    ResearchMember:
      type: object
      additionalProperties: false
      required:
        - fullName
        - email
        - affiliation
        - contributionPercent
        - role
      properties:
        fullName:
          $ref: "#/components/schemas/ResearchText"
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
          description: |
            Trim Unicode whitespace before validation and storage. Length is
            measured in Unicode code points and must be 1–254. Duplicate email
            comparison within a project is case-insensitive after trimming.
        affiliation:
          $ref: "#/components/schemas/ResearchText"
        contributionPercent:
          type: number
          minimum: 0.01
          maximum: 100
          multipleOf: 0.01
        role:
          type: string
          enum: [LEAD, CO_RESEARCHER]

    FundingType:
      type: string
      enum: [INTERNAL, EXTERNAL]

    ProjectType:
      type: string
      enum: [RESEARCH, ACADEMIC_SERVICE]

    ResearchKind:
      type: string
      enum: [BUDGET, CONTINUATION]

    BuddhistDate:
      type: string
      pattern: '^(0[1-9]|[12][0-9]|3[01])/(0[1-9]|1[0-2])/[0-9]{4}$'
      description: |
        A real calendar date in DD/MM/YYYY Buddhist Era format for requests and
        responses. The pattern alone does not validate month lengths or leap years.

    BudgetAmount:
      type: number
      minimum: 0.01
      multipleOf: 0.01
      description: Positive Thai baht amount with at most two decimal places.

    ContractFile:
      type: string
      format: binary
      description: |
        Non-empty PDF contract bytes, maximum 20 MiB (20,971,520 bytes).
        Parse the entire PDF, require at least one page, and reject malformed,
        encrypted, or password-protected files; do not rely only on filename,
        magic bytes, or MIME header. No base64 encoding.
        This is a file-size limit, not an aggregate multipart request-size limit.
      x-allowed-media-types: [application/pdf]
      x-max-file-bytes: 20971520

    ContractFileMetadata:
      type: object
      additionalProperties: false
      required: [filename, contentType, sizeBytes]
      properties:
        filename:
          $ref: "#/components/schemas/ResearchText"
        contentType:
          type: string
          const: application/pdf
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 20971520

    ResearchStatus:
      type: string
      enum:
        - กำลังดำเนินการ
        - กำลังดำเนินการ(ขยายเวลาครั้งที่ 1)
        - กำลังดำเนินการ(ขยายเวลาครั้งที่ 2)
        - กำลังดำเนินการ(ขยายเวลามากกว่า 2 ครั้ง)
        - โครงการเสร็จสิ้น
        - ยุติโครงการ

    ResearchProcess:
      type: string
      enum:
        - สัญญาโครงการ
        - บันทึกข้อตกลง
        - เปิดบัญชีธนาคาร
        - การเบิกจ่ายเงิน
        - การจัดสรรค่าธรรมเนียม
        - การติดตามส่งรายงาน
        - รายงานสรุปการใช้เงิน
        - การปิดบัญชีธนาคาร

    ResearchSummary:
      type: object
      additionalProperties: false
      required: [id, title, contractNumber, projectType, researchKind, continuationOfId, status, process]
      properties:
        id: {$ref: "#/components/schemas/ResearchId"}
        title: {$ref: "#/components/schemas/ResearchTitle"}
        contractNumber: {$ref: "#/components/schemas/ContractNumber"}
        projectType: {$ref: "#/components/schemas/ProjectType"}
        researchKind: {$ref: "#/components/schemas/ResearchKind"}
        continuationOfId: {$ref: "#/components/schemas/NullableResearchId"}
        status: {$ref: "#/components/schemas/ResearchStatus"}
        process: {$ref: "#/components/schemas/ResearchProcess"}

    User:
      type: object
      additionalProperties: false
      required: [id, name, email, academicTitleId, role, status]
      properties:
        id: {type: integer, format: int64, minimum: 1, readOnly: true}
        name: {$ref: "#/components/schemas/ResearchText"}
        email: {type: string, format: email, maxLength: 254}
        academicTitleId:
          type: [integer, "null"]
          format: int64
          minimum: 1
        role: {$ref: "#/components/schemas/UserRole"}
        status: {$ref: "#/components/schemas/AccountStatus"}

    UpdateUserRequest:
      type: object
      additionalProperties: false
      required: [name, email, academicTitleId, role]
      properties:
        name: {$ref: "#/components/schemas/ResearchText"}
        email: {type: string, format: email, maxLength: 254}
        academicTitleId:
          type: [integer, "null"]
          format: int64
          minimum: 1
        role: {$ref: "#/components/schemas/UserRole"}

    UpdateAccountStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {$ref: "#/components/schemas/AccountStatus"}

    UserRole:
      type: string
      enum: [RESEARCHER, COORDINATOR, ADMIN]

    AccountStatus:
      type: string
      enum: [PENDING, APPROVED, SUSPENDED]

    AcademicTitle:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: {type: integer, format: int64, minimum: 1, readOnly: true}
        name: {$ref: "#/components/schemas/ResearchText"}

    AcademicTitleRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {$ref: "#/components/schemas/ResearchText"}

    About:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content: {$ref: "#/components/schemas/ResearchText"}

    UpdateAboutRequest:
      $ref: "#/components/schemas/About"

    Organization:
      type: object
      additionalProperties: false
      required: [universityName, officeName, systemName, address]
      properties:
        universityName: {$ref: "#/components/schemas/ResearchText"}
        officeName: {$ref: "#/components/schemas/ResearchText"}
        systemName: {$ref: "#/components/schemas/ResearchText"}
        address: {$ref: "#/components/schemas/ResearchText"}

    UpdateOrganizationRequest:
      $ref: "#/components/schemas/Organization"

    AuditLog:
      type: object
      additionalProperties: false
      required: [id, userId, action, targetType, targetId, occurredAt]
      properties:
        id: {type: integer, format: int64, minimum: 1, readOnly: true}
        userId: {type: integer, format: int64, minimum: 1}
        researchId:
          type: [integer, "null"]
          format: int64
          minimum: 1
        action: {type: string, minLength: 1}
        targetType: {type: string, minLength: 1}
        targetId: {type: integer, format: int64, minimum: 1}
        occurredAt: {type: string, format: date-time}

    ErrorCode:
      type: string
      enum:
        - CONTINUATION_NOT_FOUND
        - ACCOUNT_PENDING
        - ACCOUNT_SUSPENDED
        - ACADEMIC_TITLE_ALREADY_EXISTS
        - ACADEMIC_TITLE_IN_USE
        - ACADEMIC_TITLE_NOT_FOUND
        - CONTRACT_NUMBER_ALREADY_EXISTS
        - CONTRACT_FILE_NOT_FOUND
        - EMAIL_ALREADY_EXISTS
        - FORBIDDEN
        - INTERNAL_ERROR
        - INVALID_JSON
        - INVALID_PROCESS_TRANSITION
        - INVALID_ACCOUNT_TRANSITION
        - INVALID_STATUS_TRANSITION
        - METHOD_NOT_ALLOWED
        - PAYLOAD_TOO_LARGE
        - PROJECT_ALREADY_ENDED
        - RESEARCH_HAS_CONTINUATIONS
        - RESEARCH_NOT_FOUND
        - ROUTE_NOT_FOUND
        - SERVICE_UNAVAILABLE
        - TITLE_ALREADY_EXISTS
        - UNAUTHORIZED
        - USER_NOT_FOUND
        - UNSUPPORTED_MEDIA_TYPE
        - VALIDATION_ERROR

    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
              minLength: 1

    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
          minLength: 1
          description: Field path such as projectMembers[0].email or contractFile.
        message:
          type: string
          minLength: 1

    ValidationErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, fieldErrors]
          properties:
            code:
              type: string
              const: VALIDATION_ERROR
            message:
              type: string
              minLength: 1
            fieldErrors:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/FieldError"

  responses:
    Unauthorized:
      description: Bearer token is missing, invalid, or expired.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
          example: {error: {code: UNAUTHORIZED, message: Authentication is required.}}
    Forbidden:
      description: The authenticated role cannot perform this operation.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
          example: {error: {code: FORBIDDEN, message: Permission is denied.}}
    AccountUnavailable:
      description: The account is pending approval or suspended.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
          examples:
            pending: {value: {error: {code: ACCOUNT_PENDING, message: Account approval is pending.}}}
            suspended: {value: {error: {code: ACCOUNT_SUSPENDED, message: Account is suspended.}}}
    ForbiddenOrAccountUnavailable:
      description: The role is forbidden or the account is pending/suspended.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
          examples:
            forbidden: {value: {error: {code: FORBIDDEN, message: Permission is denied.}}}
            pending: {value: {error: {code: ACCOUNT_PENDING, message: Account approval is pending.}}}
            suspended: {value: {error: {code: ACCOUNT_SUSPENDED, message: Account is suspended.}}}
    UserNotFound:
      description: No account has the supplied ID.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
          example: {error: {code: USER_NOT_FOUND, message: User was not found.}}
    EmailConflict:
      description: Email is already assigned to another account.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
          example: {error: {code: EMAIL_ALREADY_EXISTS, message: Email is already in use.}}
    AccountTransitionConflict:
      description: Requested account-status transition is invalid.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
          example: {error: {code: INVALID_ACCOUNT_TRANSITION, message: Account status transition is invalid.}}
    AcademicTitleNotFound:
      description: No academic title has the supplied ID.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
          example: {error: {code: ACADEMIC_TITLE_NOT_FOUND, message: Academic title was not found.}}
    AcademicTitleConflict:
      description: Academic title name already exists.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
          example: {error: {code: ACADEMIC_TITLE_ALREADY_EXISTS, message: Academic title already exists.}}
    AcademicTitleInUse:
      description: Academic title is referenced by an account.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
          example: {error: {code: ACADEMIC_TITLE_IN_USE, message: Academic title is in use.}}
    ResearchOrContractFileNotFound:
      description: Research or its contract file does not exist.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
          examples:
            research: {value: {error: {code: RESEARCH_NOT_FOUND, message: Research was not found.}}}
            file: {value: {error: {code: CONTRACT_FILE_NOT_FOUND, message: Contract file was not found.}}}
    ContinuationNotFound:
      description: continuationOfId does not reference an existing research.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: CONTINUATION_NOT_FOUND
              message: Continuation research was not found.

    InternalError:
      description: An unexpected database or internal error occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: INTERNAL_ERROR
              message: An unexpected internal error occurred.

    InvalidJson:
      description: |
        The body is empty or whitespace-only, malformed, has trailing data, or
        contains more than one JSON value.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: INVALID_JSON
              message: Request body must contain one valid JSON object.

    PayloadTooLarge:
      description: |
        The request payload exceeds the operation limit: 20 MiB (20,971,520
        bytes) for a contract PDF or 21 MiB (22,020,096 bytes) for the complete
        multipart body in POST/PUT, or 64 KiB for a PATCH JSON body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: PAYLOAD_TOO_LARGE
              message: Request payload exceeds the allowed size.

    ProcessConflict:
      description: |
        The requested process transition skips, reverses, advances beyond the
        final process, or the project has already ended.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            invalidTransition:
              value:
                error:
                  code: INVALID_PROCESS_TRANSITION
                  message: The requested process transition is invalid.
            projectEnded:
              value:
                error:
                  code: PROJECT_ALREADY_ENDED
                  message: The project has already ended.

    ResearchHasContinuations:
      description: The research is still referenced by one or more continuations.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: RESEARCH_HAS_CONTINUATIONS
              message: Research has continuations and cannot be deleted.

    ResearchNotFound:
      description: No research has the supplied positive ID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: RESEARCH_NOT_FOUND
              message: Research was not found.

    ServiceUnavailable:
      description: The database is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: SERVICE_UNAVAILABLE
              message: Service is temporarily unavailable.

    StatusConflict:
      description: |
        The requested status transition skips or reverses a normal status, or
        attempts to change a project that has already ended.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            invalidTransition:
              value:
                error:
                  code: INVALID_STATUS_TRANSITION
                  message: The requested status transition is invalid.
            projectEnded:
              value:
                error:
                  code: PROJECT_ALREADY_ENDED
                  message: The project has already ended.

    ResearchConflict:
      description: The title or normalized contract number conflicts with existing data.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            duplicateTitle:
              value:
                error:
                  code: TITLE_ALREADY_EXISTS
                  message: A research with this title already exists.
            duplicateContractNumber:
              value:
                error:
                  code: CONTRACT_NUMBER_ALREADY_EXISTS
                  message: A research with this contract number already exists.

    UnsupportedMediaType:
      description: Content-Type is missing or does not match the operation's required media type.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: UNSUPPORTED_MEDIA_TYPE
              message: Content-Type is not supported for this operation.

    ValidationError:
      description: |
        The path ID, request object, fields, duplicate keys, unknown fields, or
        query parameters violate this contract. Malformed multipart bodies,
        missing boundaries, missing/repeated/unknown parts, malformed member
        JSON, and invalid, empty, malformed, encrypted, password-protected, or
        zero-page PDFs also return this error. fieldErrors is always non-empty.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
          example:
            error:
              code: VALIDATION_ERROR
              message: Request validation failed.
              fieldErrors:
                - field: contractFile
                  message: Contract file must be a complete, readable PDF.
